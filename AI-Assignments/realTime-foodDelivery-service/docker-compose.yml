x-service-env: &service-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: swifteats
  POSTGRES_USER: swifteats
  POSTGRES_PASSWORD: swifteats
  SWIFTEATS_ALLOW_INSECURE_DEFAULTS: "true"
  ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-admin-key-change-me}
  INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-local-dev-internal-key-change-me}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  PAYMENT_MESSAGING_ENABLED: "true"
  ENTITIES_SERVICE_URL: http://entities-service:8081
  ORDER_SERVICE_URL: http://order-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  REFUND_SERVICE_URL: http://refund-service:8084
  ANALYTICS_SERVICE_URL: http://analytics-service:8085
  BACKEND_SERVICE_URL: http://backend-service:8080

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: swifteats
      POSTGRES_USER: swifteats
      POSTGRES_PASSWORD: swifteats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swifteats -d swifteats"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  db-migrate:
    image: flyway/flyway:10-alpine
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/swifteats
      FLYWAY_USER: swifteats
      FLYWAY_PASSWORD: swifteats
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./services/platform-lib/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  entities-service:
    build:
      context: ./services
      args:
        SERVICE_MODULE: entities-service
        SERVICE_PORT: 8081
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ./services
      args:
        SERVICE_MODULE: order-service
        SERVICE_PORT: 8082
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: ./services
      args:
        SERVICE_MODULE: payment-service
        SERVICE_PORT: 8083
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started

  refund-service:
    build:
      context: ./services
      args:
        SERVICE_MODULE: refund-service
        SERVICE_PORT: 8084
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      order-service:
        condition: service_started

  analytics-service:
    build:
      context: ./services
      args:
        SERVICE_MODULE: analytics-service
        SERVICE_PORT: 8085
    environment:
      <<: *service-env
      SWIFTEATS_DATASET_PATH: /data/third-assignment-sample-data-set
      ANALYTICS_IMPORT_ON_STARTUP: "false"
    volumes:
      - ./third-assignment-sample-data-set:/data/third-assignment-sample-data-set:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  backend-service:
    build:
      context: ./services
      args:
        SERVICE_MODULE: backend-service
        SERVICE_PORT: 8080
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      TRACKING_KAFKA_ENABLED: "true"
      GPS_SIMULATOR_ENABLED: "true"
      GPS_SIMULATOR_DRIVER_COUNT: "50"
      GPS_SIMULATOR_INTERVAL_MS: "5000"
      SWIFTEATS_GATEWAY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ui-service:
    build:
      context: ./ui-service
    ports:
      - "3000:80"
    depends_on:
      - backend-service

  admin-dashboard:
    build:
      context: ./admin-dashboard
    ports:
      - "3001:80"
    depends_on:
      - backend-service

  analytics-dashboard:
    build:
      context: ./analytics-dashboard
    ports:
      - "3002:80"
    depends_on:
      - backend-service

volumes:
  postgres_data:
