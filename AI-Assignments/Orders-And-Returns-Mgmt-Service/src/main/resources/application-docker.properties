# Docker profile

# Database configuration
spring.datasource.url=jdbc:postgresql://db:5432/orders_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.orderservice=INFO

# External service URLs
mock.payment.url=http://localhost:8080/mock-payment/refund

# Email configuration
# By default, disable actual email sending in Docker environment
# Set to true only when real email credentials are provided
email.sending.enabled=false
