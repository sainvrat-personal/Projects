# Common application configuration

# Server settings
server.port=8080

# JPA properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger/OpenAPI (springdoc)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Email configuration for Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:sainvrat@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:qjtxzvcsclhioigp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enable email sending
email.sending.enabled=true

# Async task executor configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=AsyncTask-

# Job scheduler configuration
scheduler.enabled=true
scheduler.process-jobs-rate=30000
scheduler.process-retry-jobs-rate=60000

# External service URLs
mock.payment.url=http://localhost:8080/mock-payment/refund
