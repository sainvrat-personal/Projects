server.address=127.0.0.1
server.port=8080
tracker.source-directory=${TRACKER_SOURCE_DIRECTORY:../..}
tracker.archive-directory=${TRACKER_ARCHIVE_DIRECTORY:${user.home}/Documents/Activity-log}
tracker.legacy-archive-directory=${TRACKER_LEGACY_ARCHIVE_DIRECTORY:}
tracker.rollover.cron=${TRACKER_ROLLOVER_CRON:0 5 0 * * *}
server.error.include-message=always
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
